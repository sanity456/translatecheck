name: TranslateCheck checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contract:
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      GENVM_VERSION: v0.6.0-rc5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: genvm-lint check contracts/translatecheck.py
      - run: genvm-lint typecheck contracts/translatecheck.py
      - run: genvm-lint check contracts/translatecheck_corrections.py
      - run: genvm-lint typecheck contracts/translatecheck_corrections.py
      - run: python -m pytest tests/direct -q
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
